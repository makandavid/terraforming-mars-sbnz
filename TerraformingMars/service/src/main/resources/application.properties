spring.application.name=tm-advisor

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:tmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=tm-username
spring.datasource.password=tm-password

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 console ? access at http://localhost:8080/h2-console during dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Load card data on startup
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true

# Disable banner
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.tm=INFO